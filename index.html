<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إلى مِنّة ❤️</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ff758c, #ff7eb3, #ffc3a0);
  color: white;
}
.card {
  margin: 20px;
  padding: 30px 20px;
  max-width: 400px;
  border-radius: 25px;
  background: rgba(255,255,255,0.2);
  box-shadow: 0 8px 30px #a52a2a44;
}
h1 { font-size: 35px; }
p { font-size: 21px; line-height: 1.9; }
button {
  border: none;
  border-radius: 30px;
  padding: 14px 25px;
  font-size: 18px;
  background: white;
  color: #e84368;
  cursor: pointer;
}
#message {
  display: none;
  font-size: 22px;
  line-height: 1.8;
}
.heart { font-size: 55px; }
</style>
</head>
<body>
<div class="card">
  <div class="heart">❤️</div>
  <h1>إلى مِنّة الجميلة ❤️</h1>
  <p>
    يا مِنّة، وجودك بيخلّي للحياة معنى أجمل،
    وابتسامتك قادرة تخلّي يومي أحلى.
    <br>
    إنتِ حكاية جميلة أتمنى تفضل مكملة.
  </p>
  <button onclick="document.getElementById('message').style.display='block'; this.style.display='none';">
    دوسي هنا يا مِنّة 💌
  </button>
  <div id="message">
    كل يوم وإنتِ أجمل حاجة في الحكاية ❤️
    <br>من شخص بيتمنالك كل السعادة 🌹
  </div>
</div>
</body>
</html>
